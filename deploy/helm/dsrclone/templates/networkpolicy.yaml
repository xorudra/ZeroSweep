{{- if .Values.networkPolicy.enabled }}
# Prompt 38 §53–§57: default-deny for the namespace, then explicit
# allows. PostgreSQL/Redis are never reachable from the Internet and
# never from web/scheduler pods; scanner workers get no path to the
# control plane beyond the API + queue.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/part-of: dsrclone } }
      ports: [{ port: 5432 }, { port: 6379 }, { port: 8000 }, { port: 9000 }]
    - to:
        - namespaceSelector: { matchLabels: { name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
{{- end }}
