# ZeroSweep — production Docker Compose (Prompt 25 §20–§23).
#
# Rules for this file:
# - NO real credentials live here or anywhere in the repo. Every secret comes
#   from the operator's environment / an external .env file that is never
#   committed (`deploy/compose/.env.production`, git-ignored), or from Docker
#   secrets. `.env.production.example` documents the variables with
#   PLACEHOLDER values only.
# - Images are referenced by immutable version tag (never `latest`); set
#   ZEROSWEEP_VERSION in the environment (release manifest, §144).
# - Migrations run ONCE as a dedicated one-shot service before the API
#   starts — API replicas never race migrations (§36).
# - Every service is hardened: non-root (image USER), read-only root
#   filesystem, all capabilities dropped, no-new-privileges, bounded tmpfs,
#   CPU/memory limits, structured json-file logging with rotation.

x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be supplied via the external env file}
  DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-10}
  DATABASE_REQUIRE_TLS: ${DATABASE_REQUIRE_TLS:-false}
  REDIS_URL: ${REDIS_URL:?REDIS_URL must be supplied via the external env file}
  REDIS_REQUIRE_TLS: ${REDIS_REQUIRE_TLS:-false}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  AI_SERVICE_URL: http://ai:8000
  API_CORS_ORIGIN: ${API_CORS_ORIGIN:?public origin of the web console}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be supplied via the external env file}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zerosweep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied externally}
      POSTGRES_DB: ${POSTGRES_DB:-zerosweep}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zerosweep}"]
      interval: 10s
      timeout: 5s
      retries: 6
    <<: *hardening
    # Postgres needs to write its data dir + /tmp + run dir only.
    tmpfs: ["/tmp", "/var/run/postgresql"]
    read_only: false
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied externally}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied externally}
    <<: *hardening
    read_only: false
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?object storage root user supplied externally}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?object storage root password supplied externally}
    volumes:
      - object-data:/data
    <<: *hardening
    read_only: false
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # One-shot controlled migration (§36–§39): preflight + `prisma migrate
  # deploy` under an advisory lock; exits before app services start.
  migrate:
    image: ghcr.io/xorudra/zerosweep-migrate:${ZEROSWEEP_VERSION:?set ZEROSWEEP_VERSION to an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/docker/migrate.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be supplied via the external env file}
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    <<: *hardening
    tmpfs: ["/tmp"]

  api:
    image: ghcr.io/xorudra/zerosweep-api:${ZEROSWEEP_VERSION:?set ZEROSWEEP_VERSION to an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    <<: *hardening
    tmpfs: ["/tmp"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 1G }

  scheduler:
    image: ghcr.io/xorudra/zerosweep-scheduler:${ZEROSWEEP_VERSION:?set ZEROSWEEP_VERSION to an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/docker/scheduler.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-15000}
    depends_on:
      migrate: { condition: service_completed_successfully }
    <<: *hardening
    tmpfs: ["/tmp"]
    deploy:
      # Exactly one replica by default; the Prompt 22 database lease keeps a
      # single active control plane even if this is scaled (§129).
      replicas: 1
      resources:
        limits: { cpus: "0.5", memory: 512M }

  worker-general:
    image: ghcr.io/xorudra/zerosweep-worker:${ZEROSWEEP_VERSION:?set ZEROSWEEP_VERSION to an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
      args: { ZEROSWEEP_WORKER_TYPE: GENERAL_WEB }
    restart: unless-stopped
    environment:
      <<: *app-env
      ZEROSWEEP_WORKER_TYPE: GENERAL_WEB
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    <<: *hardening
    tmpfs: ["/tmp"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2.0", memory: 2G }

  worker-network:
    image: ghcr.io/xorudra/zerosweep-worker:${ZEROSWEEP_VERSION:?set ZEROSWEEP_VERSION to an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
      args: { ZEROSWEEP_WORKER_TYPE: NETWORK_EXTERNAL }
    restart: unless-stopped
    environment:
      <<: *app-env
      ZEROSWEEP_WORKER_TYPE: NETWORK_EXTERNAL
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    <<: *hardening
    tmpfs: ["/tmp"]
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "2.0", memory: 2G }

  ai:
    image: ghcr.io/xorudra/zerosweep-ai:${ZEROSWEEP_VERSION:?set ZEROSWEEP_VERSION to an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/docker/ai.Dockerfile
    restart: unless-stopped
    environment:
      # The copilot's fail-closed service-key gate reads NODE_ENV +
      # AI_SERVICE_KEY (security audit 2026-10-16 run-2): without these
      # the shipped production topology ran the AI in development mode
      # with the gate open.
      NODE_ENV: production
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?set the shared AI service key}
    <<: *hardening
    tmpfs: ["/tmp"]
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "1.0", memory: 1G }

  web:
    image: ghcr.io/xorudra/zerosweep-web:${ZEROSWEEP_VERSION:?set ZEROSWEEP_VERSION to an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [api]
    <<: *hardening
    tmpfs: ["/tmp"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ---- Prompt 38 §117/§206: optional observability profile -----------
  # Reference monitoring stack. Enable with `--profile observability`.
  # Images are pinned release tags; dashboards/rules/configs mount from
  # deploy/monitoring. None of these services is required for the
  # platform itself to run.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules ship as a PrometheusRule CRD (deploy/monitoring/
      # prometheus-rules.yaml) for operator-managed clusters; for this
      # compose stack, extract the spec.groups into a plain rules file
      # and mount it at /etc/prometheus/rules/ to enable alerting.
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    <<: *hardening
    tmpfs: ["/tmp"]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [observability]
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    <<: *hardening
    tmpfs: ["/tmp"]
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      # No default production password ships anywhere (§214): the admin
      # password comes from the operator's env file or first-run setup.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the external env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/dashboards:/var/lib/grafana/dashboards/zerosweep:ro
      - ../monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    <<: *hardening
    tmpfs: ["/tmp"]
  loki:
    image: grafana/loki:3.2.0
    profiles: [observability]
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki-config.yaml]
    volumes:
      - ../monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    <<: *hardening
    tmpfs: ["/tmp"]
  otel-collector:
    image: otel/opentelemetry-collector:0.114.0
    profiles: [observability]
    restart: unless-stopped
    command: [--config=/etc/otelcol/otel-collector.yaml]
    volumes:
      - ../monitoring/otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    <<: *hardening
    tmpfs: ["/tmp"]

volumes:
  postgres-data:
  redis-data:
  object-data:
  prometheus-data:
  grafana-data:
  loki-data:
