# Prometheus alert rules (Prompt 25 §110 operational, §111 security).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zerosweep
  labels: { app.kubernetes.io/part-of: zerosweep }
spec:
  groups:
    - name: zerosweep.operational
      rules:
        - alert: ZerosweepHighHttpErrorRate
          expr: sum(rate(zerosweep_http_requests_total{status_class="5xx"}[5m])) / sum(rate(zerosweep_http_requests_total[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "API 5xx rate above 5% for 10m"
            runbook: "docs/operations/platform-incident-runbook.md"
        - alert: ZerosweepDependencyDown
          expr: zerosweep_dependency_up == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "A platform dependency reports down ({{ $labels.dependency }})"
            runbook: "docs/operations/platform-incident-runbook.md"
        - alert: ZerosweepQueueBacklogGrowing
          expr: zerosweep_queue_waiting_jobs > 100
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Scan queue backlog above threshold — scale the affected worker pool"
            runbook: "docs/operations/scanner-worker-runbook.md"
        - alert: ZerosweepScanFailureRateHigh
          expr: zerosweep_scan_jobs_failed_total / clamp_min(zerosweep_scan_jobs_total, 1) > 0.2
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "More than 20% of scan jobs failing"
            runbook: "docs/operations/scanner-worker-runbook.md"
        - alert: ZerosweepSchedulerLeaseStale
          expr: time() - zerosweep_scheduler_lease_heartbeat_timestamp > 300
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "Scheduler lease heartbeat stale — the standby should have taken over; verify exactly one active scheduler"
            runbook: "docs/operations/disaster-recovery-runbook.md"
        - alert: ZerosweepBackupStale
          expr: time() - zerosweep_backup_last_success_timestamp > 90000
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "No successful VERIFIED backup in 25h (an upload alone does not count — §123)"
            runbook: "docs/operations/backup-restore-runbook.md"
        - alert: ZerosweepRestoreVerificationFailed
          expr: zerosweep_restore_verification_success == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "Automated restore verification failed — backups are NOT proven restorable"
            runbook: "docs/operations/backup-restore-runbook.md"
        - alert: ZerosweepCertificateExpiringSoon
          expr: (zerosweep_tls_certificate_expiry_timestamp - time()) < 14 * 24 * 3600
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "A production TLS certificate expires within 14 days (Prompt 38 §121)"
            runbook: "docs/security/production-tls.md"
        - alert: ZerosweepMigrationFailed
          expr: zerosweep_db_migration_current == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Database migration state is not current — a migration job failed or is pending (Prompt 38 §121)"
            runbook: "docs/operations/upgrade-runbook.md"
        - alert: ZerosweepWorkerPoolUnavailable
          expr: sum by (pool) (zerosweep_worker_heartbeat_age_ms) > 600000
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "An entire worker pool has no fresh heartbeat — its queue class is not being processed (Prompt 38 §121)"
            runbook: "docs/operations/monitoring-runbook.md"
        - alert: ZerosweepDiskPressureRisk
          expr: zerosweep_ephemeral_storage_used_ratio > 0.85
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Ephemeral storage above 85% — scans risk disk-limit termination"
            runbook: "docs/operations/monitoring-alerting-runbook.md"
    - name: zerosweep.security
      rules:
        - alert: ZerosweepRepeatedAuthenticationFailures
          expr: sum(rate(zerosweep_auth_failures_total[5m])) > 0.5
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Repeated authentication failures — possible credential probing (Prompt 38 §122)"
            runbook: "docs/operations/platform-incident-runbook.md"
        - alert: ZerosweepSecretProviderFailure
          expr: sum(rate(zerosweep_secret_provider_errors_total[5m])) > 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Secret provider errors — workloads may fail to start or rotate credentials (Prompt 38 §122)"
            runbook: "docs/security/production-secrets.md"
        - alert: ZerosweepAuthorizationDenialsSpike
          expr: sum(rate(zerosweep_authorization_denied_total[5m])) > 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Spike in authorization/scope denials — possible probing or misconfiguration"
            runbook: "docs/operations/platform-incident-runbook.md"
        - alert: ZerosweepScopeViolationAttempt
          expr: sum(increase(zerosweep_scope_violation_total[5m])) > 0
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: "A scan was attempted against an out-of-scope target and refused"
            runbook: "docs/operations/platform-incident-runbook.md"
        - alert: ZerosweepPrivilegedWorkloadDetected
          expr: zerosweep_privileged_workloads > 0
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: "A privileged workload exists in a ZeroSweep namespace — admission should have rejected it"
            runbook: "docs/security/kubernetes-production-hardening.md"
        - alert: ZerosweepScannerCapabilityViolation
          expr: sum(increase(zerosweep_scanner_capability_violation_total[5m])) > 0
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: "A stage attempted a tool/capability outside its pool's ScannerCapabilityPolicy"
            runbook: "docs/operations/scanner-worker-runbook.md"
        - alert: ZerosweepBreakGlassUsed
          expr: sum(increase(zerosweep_break_glass_total[1h])) > 0
          for: 0m
          labels: { severity: warning }
          annotations:
            summary: "Break-glass access was used — confirm the incident record and review within 24h"
            runbook: "docs/operations/platform-incident-runbook.md"
        - alert: ZerosweepAuditWriteFailures
          expr: sum(rate(zerosweep_audit_write_failures_total[5m])) > 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Audit records are failing to persist — treat as a security incident"
            runbook: "docs/operations/platform-incident-runbook.md"
