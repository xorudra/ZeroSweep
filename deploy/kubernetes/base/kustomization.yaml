# ZeroSweep Kubernetes base — the CANONICAL deployment path (Prompt 25
# §24–§26). The Helm chart under deploy/helm renders an equivalent subset
# for Helm-native shops; semantics live HERE. scan-job.yaml is a template
# reference for the worker controller and is intentionally NOT a resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zerosweep-production
resources:
  - namespace.yaml
  - configmap.yaml
  - rbac.yaml
  - api.yaml
  - web.yaml
  - ai.yaml
  - scheduler.yaml
  - workers.yaml
  - migration-job.yaml
  - ingress.yaml
  - networkpolicies.yaml
  - platform.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
commonAnnotations:
  zerosweep.io/release-channel: "base"
images:
  - name: ghcr.io/xorudra/zerosweep-api
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-web
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-ai
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-worker
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-scheduler
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-migrate
    newTag: "25.0.0"
