# Non-secret configuration ONLY (Prompt 25 §28). Secrets live in the
# zerosweep-secrets Secret, populated by the operator's secret manager
# (External Secrets / sealed secrets / cloud KMS) — never in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zerosweep-config
  labels: { app.kubernetes.io/part-of: zerosweep }
data:
  NODE_ENV: "production"
  API_PORT: "4000"
  DATABASE_CONNECTION_LIMIT: "10"
  DATABASE_REQUIRE_TLS: "true"
  REDIS_REQUIRE_TLS: "true"
  MINIO_ENDPOINT: "https://objects.zerosweep.internal:9000"
  MINIO_BUCKET: "zerosweep-artifacts"
  AI_SERVICE_URL: "http://ai:8000"
  API_CORS_ORIGIN: "https://app.example.com"
  SCHEDULER_TICK_MS: "15000"
  # Object-storage key prefix layout (§45): organization/workspace/resource
  # is enforced by the application when writing objects.
  OBJECT_STORAGE_LAYOUT: "tenant-prefixed"
---
# Template ONLY — placeholder values, never real credentials. The live
# Secret is created by the secret-management flow (deploy/README.md) and is
# intentionally not part of the Kustomize resources.
apiVersion: v1
kind: Secret
metadata:
  name: zerosweep-secrets-template
  labels: { app.kubernetes.io/part-of: zerosweep }
  annotations:
    zerosweep.example/template-only: "true — do not apply; create zerosweep-secrets from your secret manager"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/zerosweep?schema=public&sslmode=require"
  REDIS_URL: "rediss://:PASSWORD@HOST:6379"
  JWT_SECRET: "REPLACE-WITH-AT-LEAST-32-RANDOM-CHARS"
