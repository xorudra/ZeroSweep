# Staging overlay: production-shaped, smaller scale; staging data is
# synthetic or minimized — never a copy of production tenant data (§32).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zerosweep-staging
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: worker-network }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
commonAnnotations:
  zerosweep.io/release-channel: "staging"
images:
  - name: ghcr.io/xorudra/zerosweep-api
    newTag: "25.0.0-rc.1"
  - name: ghcr.io/xorudra/zerosweep-web
    newTag: "25.0.0-rc.1"
  - name: ghcr.io/xorudra/zerosweep-ai
    newTag: "25.0.0-rc.1"
  - name: ghcr.io/xorudra/zerosweep-worker
    newTag: "25.0.0-rc.1"
  - name: ghcr.io/xorudra/zerosweep-scheduler
    newTag: "25.0.0-rc.1"
  - name: ghcr.io/xorudra/zerosweep-migrate
    newTag: "25.0.0-rc.1"
