# Production overlay: base scale + release tags pinned per release. The tag
# bump in a release commit IS the rollout trigger; digests are recorded in
# release-manifest.json (§144) and admission verifies them (§18/§141).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsrclone-production
resources:
  - ../../base
commonAnnotations:
  dsrclone.io/release-channel: "production"
images:
  - name: ghcr.io/xorudra/dsrclone-api
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/dsrclone-web
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/dsrclone-ai
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/dsrclone-worker
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/dsrclone-scheduler
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/dsrclone-migrate
    newTag: "25.0.0"
