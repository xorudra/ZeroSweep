# Production overlay: base scale + release tags pinned per release. The tag
# bump in a release commit IS the rollout trigger; digests are recorded in
# release-manifest.json (§144) and admission verifies them (§18/§141).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zerosweep-production
resources:
  - ../../base
commonAnnotations:
  zerosweep.io/release-channel: "production"
images:
  - name: ghcr.io/xorudra/zerosweep-api
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-web
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-ai
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-worker
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-scheduler
    newTag: "25.0.0"
  - name: ghcr.io/xorudra/zerosweep-migrate
    newTag: "25.0.0"
