# Development overlay: single replicas, dev namespace, relaxed quotas.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zerosweep
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: worker-general }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 2
images:
  - name: ghcr.io/xorudra/zerosweep-api
    newTag: "dev"
  - name: ghcr.io/xorudra/zerosweep-web
    newTag: "dev"
  - name: ghcr.io/xorudra/zerosweep-ai
    newTag: "dev"
  - name: ghcr.io/xorudra/zerosweep-worker
    newTag: "dev"
  - name: ghcr.io/xorudra/zerosweep-scheduler
    newTag: "dev"
  - name: ghcr.io/xorudra/zerosweep-migrate
    newTag: "dev"
