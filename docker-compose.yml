# ZeroSweep local infrastructure. Credentials come from .env (see .env.example).
# These defaults are LOCAL DEVELOPMENT ONLY — never use them in production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dsrclone-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsrclone}
      POSTGRES_USER: ${POSTGRES_USER:-dsrclone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsrclone} -d ${POSTGRES_DB:-dsrclone}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dsrclone-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dsrclone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dsrclone-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dsrclone-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-dsrclone-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set private local/$$MINIO_BUCKET;
      echo 'bucket ready';
      "

  # Application services (optional in compose; normally run via `pnpm dev`)
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "${API_PORT:-4000}:4000"

  ai:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    profiles: ["app"]
    env_file: .env
    ports:
      - "${AI_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Prompt 13 §10: container/image/manifest analysis runs on an isolated
  # worker type. Static analysis only — this service has NO Docker
  # socket mount and never executes an image (§9/§30).
  worker-container-analysis:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      DSRCLONE_WORKER_TYPE: CONTAINER_ANALYSIS
      DSRCLONE_WORKER_CAPABILITIES: CONTAINER_ANALYSIS
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Prompt 14 §10/§11: multi-cloud assessment runs on an isolated worker
  # type — the ONLY worker that may resolve cloud credential references
  # (under job-scoped leases) and run cloud adapters. Assessment is
  # read-only: provider transports call Describe/Get/List APIs only,
  # and no remediation capability exists in this service.
  worker-cloud-analysis:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      DSRCLONE_WORKER_TYPE: CLOUD_ANALYSIS
      DSRCLONE_WORKER_CAPABILITIES: CLOUD_ANALYSIS
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Prompt 15 §10/§11: the ONLY worker that may run directory
  # collection (DIRECTORY_ANALYSIS). Deployed inside the approved
  # internal engagement segment with network reachability to the
  # registered domain controllers only — never part of the general
  # worker pool, and credential leases are issued to it alone (§12).
  worker-directory-analysis:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      DSRCLONE_WORKER_TYPE: DIRECTORY_ANALYSIS
      DSRCLONE_WORKER_CAPABILITIES: DIRECTORY_ANALYSIS
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Prompt 13 §28/§39: the ONLY worker that may run the INTERNAL_PRIVILEGED
  # CIS benchmark adapters (Docker Bench / kube-bench), and only against
  # explicitly approved hosts/clusters. Deployed on the assessed host's
  # segment by the operator — never part of the general worker pool.
  worker-privileged-host:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles: ["privileged"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      DSRCLONE_WORKER_TYPE: PRIVILEGED_HOST
      DSRCLONE_WORKER_CAPABILITIES: PRIVILEGED_HOST_ASSESSMENT
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    profiles: ["app"]
    env_file: .env
    depends_on: [api]
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
