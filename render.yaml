# ZeroSweep — Render Blueprint (free-tier demo deployment)
# Deploys the full platform from this repo: API + worker + web console + AI
# service, backed by a free Render Postgres and a free Render Key Value
# (Redis-compatible) instance.
#
# Honest free-tier notes (see docs/operations for the production paths):
# - Free web services spin down after ~15 min idle (first hit wakes them,
#   expect a slow first response) and share 750 free instance hours/month.
# - Free Postgres expires after 30 days; this is a demo deployment, not the
#   production topology (Helm/compose under deploy/ are the production path).
# - The worker runs as a free web service with a tiny health-port shim
#   (scripts/render/worker-start.sh) because Render has no free worker tier.
# - No S3 object storage is attached on Render's free tier, so the API
#   health endpoint honestly reports object storage as down; every other
#   check is live. Attach any S3-compatible bucket via the S3_* env vars
#   to close that gap.
# - PRODUCT_MODE is SELF_HOSTED: one deployment, one operator — matching
#   how this instance is run.

envVarGroups:
  - name: zerosweep-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - type: keyvalue
    name: zerosweep-redis
    plan: free
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere (access still requires the generated connection string)

  - type: web
    name: zerosweep-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack prepare pnpm@9.15.0 --activate && NODE_ENV=development corepack pnpm install --frozen-lockfile && corepack pnpm --filter @zerosweep/database exec prisma generate && corepack pnpm --filter @zerosweep/api... build
    startCommand: bash scripts/render/api-start.sh
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Launch Safety B20: optional migration-only connection (privileged
      # role). When set, `prisma migrate deploy` in api-start.sh runs with
      # this URL while the API process keeps using DATABASE_URL. Unset =
      # migrations fall back to DATABASE_URL (previous behaviour).
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zerosweep-redis
          property: connectionString
      - fromGroup: zerosweep-shared
      - key: API_CORS_ORIGIN
        value: https://zerosweep-web.onrender.com
      - key: AI_SERVICE_URL
        value: https://zerosweep-ai.onrender.com
      - key: WORKER_SERVICE_URL
        value: https://zerosweep-worker.onrender.com
      - key: WEB_APP_URL
        value: https://zerosweep-web.onrender.com
      - key: PRODUCT_MODE
        value: SELF_HOSTED
      # Invite-only deployment (owner decision 2026-10-10): public
      # sign-up is closed; new accounts come from organization
      # invitations only. The dashboard env var is what the running
      # service reads — keep the two in step.
      - key: REGISTRATION_MODE
        value: invite-only
      - key: PRODUCT_PLATFORM_ADMIN_EMAILS
        value: forapikeyonly2008@gmail.com
      - key: METRICS_TOKEN
        sync: false

  - type: web
    name: zerosweep-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack prepare pnpm@9.15.0 --activate && NODE_ENV=development corepack pnpm install --frozen-lockfile && corepack pnpm --filter @zerosweep/database exec prisma generate && corepack pnpm --filter @zerosweep/worker... build
    startCommand: bash scripts/render/worker-start.sh
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zerosweep-redis
          property: connectionString
      - fromGroup: zerosweep-shared

  - type: web
    name: zerosweep-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r apps/ai/requirements.txt
    startCommand: cd apps/ai && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_KEY
        sync: false

  - type: web
    name: zerosweep-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack prepare pnpm@9.15.0 --activate && NODE_ENV=development corepack pnpm install --frozen-lockfile && corepack pnpm --filter @zerosweep/web... build
    startCommand: cd apps/web && ./node_modules/.bin/next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://zerosweep-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_AI_URL
        value: https://zerosweep-ai.onrender.com
      - key: NEXT_PUBLIC_WORKER_URL
        value: https://zerosweep-worker.onrender.com
